[package]
name = "lc-coop-server"
version = "0.2.2"
edition = "2021"
description = "LC_Coop dedicated coordination server with persistent state"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
